name: UAT to Prod Promotion

on:
  workflow_dispatch:
    inputs:
      deployment_reason:
        description: 'Reason for production deployment'
        required: true
        default: 'UAT testing completed successfully'
      jira_ticket:
        description: 'JIRA ticket number'
        required: true

env:
  SOURCE_BRANCH: uat
  TARGET_BRANCH: prod

jobs:
  create-prod-pr:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 0
    
    - name: Install jq for JSON parsing
      run: sudo apt-get update && sudo apt-get install -y jq
    
    - name: Check for existing PR
      id: check-pr
      run: |
        response=$(curl -s -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/pulls?state=open&base=prod&head=uat")
        pr_count=$(echo "$response" | jq length)
        echo "pr_exists=$pr_count" >> $GITHUB_OUTPUT
    
    - name: Create Production PR
      if: steps.check-pr.outputs.pr_exists == 0
      run: |
        echo "Creating PR from uat to prod..."
        echo "JIRA Ticket: ${{ github.event.inputs.jira_ticket }}"
        echo "Deployment Reason: ${{ github.event.inputs.deployment_reason }}"
        
        pr_response=$(curl -s -X POST \
          -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/pulls" \
          -d '{
            "title": "🚀 PRODUCTION: ${{ github.event.inputs.jira_ticket }} - UAT to Prod Deployment",
            "body": "## Production Deployment Request\n\n**JIRA Ticket:** ${{ github.event.inputs.jira_ticket }}\n**Deployment Reason:** ${{ github.event.inputs.deployment_reason }}\n\n### Checkpoints Completed:\n- ✅ DEV testing successful\n- ✅ UAT testing successful\n\n### Approval Required:\n- [ ] Manager approval required from CODEOWNERS\n\nChanges are ready for production deployment after successful testing.",
            "head": "uat",
            "base": "prod"
          }')
        
        pr_url=$(echo "$pr_response" | jq -r '.html_url')
        pr_number=$(echo "$pr_response" | jq -r '.number')
        
        echo "PR created: $pr_url"
        echo "PR_NUMBER=$pr_number" >> $GITHUB_ENV